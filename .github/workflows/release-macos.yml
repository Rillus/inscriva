name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-macos/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm build:desktop

      - name: Package .app bundle
        run: |
          APP_PATH=$(find apps/desktop-macos/src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            find apps/desktop-macos/src-tauri/target/release/bundle -maxdepth 3
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Inscriva-macos.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Inscriva-macos.zip
          generate_release_notes: true
